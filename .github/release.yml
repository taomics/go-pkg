changelog:
  categories:
    - title: "⚠️ Breaking Changes"
      labels:
        - "breaking-change"
        - "breaking"
    - title: "🚀 New Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "⚙️ Dependency Updates"
      labels:
        - "dependencies"
    - title: "📝 Documentation"
      labels:
        - "documentation"
    - title: "Other Changes"
      labels:
        - "*"
  exclude:
    authors:
      - "dependabot[bot]"
      - "github-actions[bot]"
